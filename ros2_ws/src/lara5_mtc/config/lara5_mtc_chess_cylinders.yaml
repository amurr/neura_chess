# Parameters for lara5_mtc_chess_cylinders_pick_place (cylinder collision scene).
# Grasp poses come from TF (publish_grasp_tf). Occupancy only selects the move.
/**:
  ros__parameters:
    planning_scene_timeout_s: 30.0

    chess_source_square: "e2"
    chess_target_square: "e4"
    chess_occupancy_file: ""  # empty = share/xyz_motion/examples/standard_start.json
    chess_seed_pose: "pre_pick"
    chess_square_size_m: 0.04
    chess_grasp_clearance_m: 0.015
    chess_approach_m: 0.08
    chess_lift_m: 0.08
    chess_place_descent_m: 0.04

    # TF frames published by xyz_motion/publish_grasp_tf
    chess_world_frame: "world"
    chess_grasp_frame_prefix: "grasp"
    chess_pick_frame: ""   # empty → grasp/<source>
    chess_place_frame: ""  # empty → grasp/<target>
    chess_tf_timeout_s: 10.0
    # cartesian = XYZ delta from seed (proven). pose = MoveTo TF hover (applies TF orientation).
    chess_hover_mode: "cartesian"
    # world = ±Z in world. eef = tool +Z (into the board once TF orientation is applied).
    chess_approach_frame: "world"

    auto_execute: false
    keep_alive_s: -1.0  # RViz: stay up until Ctrl+C when auto_execute is false
    dump_solution_preview: true
    solution_preview_dir: ""
    solution_preview_file: ""

    # During auto_execute: TF xyz of each link (world frame) + CSV
    log_link_poses: true
    log_link_poses_hz: 10.0
    log_link_poses_file: "/tmp/lara5_link_poses.csv"
