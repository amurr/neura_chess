# Heuristics for choosing an arm style without specifying full joint vectors.
# Used by LLM task builders and future C++ loaders (not wired yet).
#
# Priority: explicit style id > rules below > default_style from catalog.yaml

version: 1
default: pre_pick_over_board

# Map high-level LLM / task knobs to catalog style ids.
semantic_aliases:
  home: stand_home
  retreat: stand_home
  seed: pre_pick_over_board
  over_board: pre_pick_over_board
  transit: mid_move_transit
  elevated: mid_move_transit

# Optional region hints (file = chess file a–h). Extend as new SRDF states are added.
region_rules:
  - when:
      files: [a, b, c]
      planned_style: pre_pick_queenside
    fallback: pre_pick_over_board
    note: Queenside squares may need a different shoulder angle once SRDF state exists.

  - when:
      files: [f, g, h]
      planned_style: pre_pick_kingside
    fallback: pre_pick_over_board

  - when:
      ranks: [7, 8]
      planned_style: pre_pick_far_rank
    fallback: pre_pick_over_board
    note: Far rank may need higher elbow; tune SRDF then switch fallback.

# Retry order when planning fails (try next seed before tweaking joints).
retry_sequence:
  - pre_pick_over_board
  - mid_move_transit
  - stand_home

# What the LLM should output vs read-only feedback.
llm_interface:
  write_fields:
    - arm_style          # catalog style id or semantic alias
    - source_square
    - target_square
    - approach.mode      # top_down | explicit_rpy
    - approach.hover_z_m
    - approach.approach_m
  read_only_fields:
    - solution.arm_joints_rad   # from solution_latest.json per stage
    - solution.eef              # FK result; not a goal input
