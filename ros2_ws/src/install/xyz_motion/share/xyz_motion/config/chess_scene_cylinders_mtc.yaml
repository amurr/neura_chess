# Cylinder collision for MTC/RViz: planning scene only (no MarkerArray topics).
# Launch: ros2 launch xyz_motion chess_scene.launch.py use_cylinder_collision:=true planning_scene_only:=true
chess_scene:
  ros__parameters:
    planning_scene_topic: /planning_scene
    planning_frame: world
    chess_occupancy_topic: /chess_occupancy
    square_size: 0.04
    board_thickness: 0.02
    piece_diameter: 0.035
    piece_height: 0.05
    initial_piece_z: 0.0

    board_layout: ranks_x_files_y
    board_file_mirror: true
    allow_empty_occupancy: false
    planning_scene_batch_size: 8
    full_snapshot_min_squares: 16
    use_convex_hull_collision: false

    publish_board_on_startup: true
    publish_initial_pieces: true
    publish_board_markers: false
    publish_piece_markers: false
    board_markers_republish_hz: 0.0

    board_a1: [0.27, -0.16, 0.02]
    board_b1: [0.31, -0.16, 0.02]
    board_a2: [0.27, -0.12, 0.02]

    piece_dims:
      pawn: [0.018, 0.034]
      bishop: [0.022, 0.047]
      knight: [0.024, 0.049]
      rook: [0.026, 0.044]
      queen: [0.027, 0.058]
      king: [0.029, 0.066]
