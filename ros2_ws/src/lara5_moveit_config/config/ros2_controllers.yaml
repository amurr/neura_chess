# Shared by mock (plan/CI) and Isaac (topic_based_ros2_control).
# MoveIt talks to these action servers; the hardware plugin in the URDF
# decides whether commands stay local or go to /isaac_joint_commands.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: position_controllers/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - lara5_joint1
      - lara5_joint2
      - lara5_joint3
      - lara5_joint4
      - lara5_joint5
      - lara5_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joint: lara5_gripper_finger_joint
    # Isaac jaw can oscillate at the URDF limit; don't block the whole MTC execute.
    allow_stalling: true
    stall_timeout: 1.0
    stall_velocity_threshold: 100.0
    goal_tolerance: 0.2