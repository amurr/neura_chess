# ros2_control controllers for control.launch.py (mock hardware from config/lara5.urdf.xacro).
# Action servers they expose must match config/moveit_controllers.yaml:
#   /arm_controller/follow_joint_trajectory   (control_msgs/action/FollowJointTrajectory)
#   /gripper_controller/gripper_cmd           (control_msgs/action/GripperCommand)
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - lara5_joint1
      - lara5_joint2
      - lara5_joint3
      - lara5_joint4
      - lara5_joint5
      - lara5_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0

gripper_controller:
  ros__parameters:
    joint: lara5_gripper_finger_joint
    goal_tolerance: 0.01
    max_effort: 0.0
    # Holding a chess piece = stalled jaw. Report success instead of aborting.
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
